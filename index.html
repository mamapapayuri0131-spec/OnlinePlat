<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>OnlinePlat</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { background: #0f172a; color: #fff; font-family: sans-serif; overflow: hidden; width: 100vw; height: 100vh; }
        .screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0f172a; z-index: 10; }
        .hidden { display: none !important; }
        .btn { background: #2563eb; color: #fff; border: none; padding: 12px 24px; font-size: 1rem; border-radius: 8px; cursor: pointer; margin: 6px; width: 220px; font-weight: bold; }
        input { padding: 10px; font-size: 1rem; border-radius: 8px; border: 1px solid #475569; background: #1e293b; color: #fff; margin: 6px; width: 220px; text-align: center; }
        #game-ui { position: absolute; inset: 0; display: none; flex-direction: column; }
        canvas { flex-grow: 1; display: block; background: #1e293b; }
        #controls { position: absolute; bottom: 20px; width: 100%; display: flex; justify-content: space-between; padding: 0 30px; pointer-events: none; z-index: 5; }
        .t-btn { width: 65px; height: 65px; background: rgba(51,65,85,0.8); border-radius: 50%; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; pointer-events: auto; cursor: pointer; }
        .v-tag { position: fixed; bottom: 10px; right: 15px; color: #38bdf8; font-weight: bold; font-size: 0.85rem; z-index: 20; }
    </style>
</head>
<body>
    <div id="mode-screen" class="screen">
        <h1>OnlinePlat</h1>
        <input type="text" id="p-name" value="Player">
        <button class="btn" id="b-off">オフライン</button>
        <button class="btn" id="b-on">オンライン</button>
    </div>

    <div id="game-ui">
        <canvas id="canvas"></canvas>
        <div id="controls">
            <div style="display:flex; gap:10px;"><div class="t-btn" id="b-z">Z</div><div class="t-btn" id="b-x">X</div></div>
            <div class="t-btn" id="b-c">C</div>
        </div>
    </div>

    <div class="v-tag">v0.1.0</div>
    <audio id="bgm" autoplay loop></audio>

    <script>
        const keys = {};
        window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

        function bind(id, k1, k2) {
            const el = document.getElementById(id);
            if(!el) return;
            ['mousedown','touchstart'].forEach(ev => el.addEventListener(ev, e => { e.preventDefault(); keys[k1]=true; keys[k2]=true; }));
            ['mouseup','touchend','mouseleave'].forEach(ev => el.addEventListener(ev, e => { e.preventDefault(); keys[k1]=false; keys[k2]=false; }));
        }
        bind('b-z', 'z', 'arrowleft');
        bind('b-x', 'x', 'arrowright');
        bind('b-c', 'c', ' ');

        let socket, myId, players = {};
        let x = 100, y = 1500, vx = 0, vy = 0;

        async function initBgm() {
            try {
                const res = await fetch('/api/bgm-tracks');
                const data = await res.json();
                if(data.tracks?.length) {
                    const audio = document.getElementById('bgm');
                    audio.src = data.tracks[0].previewUrl;
                    audio.play().catch(()=>{});
                }
            } catch(e){}
        }

        window.addEventListener('DOMContentLoaded', () => {
            initBgm();
            document.getElementById('b-off').addEventListener('click', () => start('offline'));
            document.getElementById('b-on').addEventListener('click', () => start('online'));
        });

        function start(mode) {
            document.getElementById('mode-screen').classList.add('hidden');
            document.getElementById('game-ui').style.display = 'flex';
            
            socket = io();
            socket.on('connect', () => {
                myId = socket.id;
                socket.emit('join_room', { mode, playerData: { name: document.getElementById('p-name').value, x, y } });
            });
            socket.on('update_players', p => players = p);
            socket.on('player_moved', ({id, data}) => { if(players[id]) Object.assign(players[id], data); });

            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            const plats = [{x:-1000, y:1600, w:10000, h:100}, {x:300, y:1450, w:200, h:20}, {x:600, y:1300, w:200, h:20}];

            function loop() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight - 50;

                vx = keys['z'] || keys['arrowleft'] ? -6 : (keys['x'] || keys['arrowright'] ? 6 : 0);
                if((keys['c'] || keys[' ']) && vy === 0) vy = -12;
                vy += 0.55;
                x += vx;
                y += vy;

                let grounded = false;
                plats.forEach(p => {
                    if(x + 30 > p.x && x < p.x + p.w && y + 40 >= p.y && y + 40 <= p.y + p.h + 15 && vy >= 0) {
                        y = p.y - 40; vy = 0; grounded = true;
                    }
                });
                if(y > 2000) { x = 100; y = 1500; vy = 0; }

                if(socket?.connected) socket.emit('player_move', {x, y});

                ctx.clearRect(0,0,canvas.width,canvas.height);
                ctx.save();
                ctx.translate(-x + canvas.width/2, -y + canvas.height/2);

                ctx.fillStyle = '#475569';
                plats.forEach(p => ctx.fillRect(p.x, p.y, p.w, p.h));

                if(players[myId]) { players[myId].x = x; players[myId].y = y; }
                for(let id in players) {
                    const p = players[id];
                    ctx.fillStyle = id === myId ? '#38bdf8' : '#f43f5e';
                    ctx.fillRect(p.x, p.y, 30, 40);
                }
                ctx.restore();
                requestAnimationFrame(loop);
            }
            requestAnimationFrame(loop);
        }
    </script>
</body>
</html>
