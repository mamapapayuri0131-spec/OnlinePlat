<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OnlinePlat</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { background: #0f172a; color: #f8fafc; font-family: sans-serif; overflow: hidden; width: 100vw; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        
        .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0f172a; z-index: 50; padding: 20px; text-align: center; }
        .screen.hidden { display: none !important; }
        
        h1 { font-size: 2.2rem; margin-bottom: 10px; color: #38bdf8; }
        .instructions { font-size: 0.9rem; color: #94a3b8; margin-bottom: 15px; line-height: 1.4; background: #1e293b; padding: 10px; border-radius: 8px; border: 1px solid #475569; max-width: 320px; text-align: left; }
        .btn { background: #2563eb; color: white; border: none; padding: 14px 24px; font-size: 1.1rem; border-radius: 8px; cursor: pointer; margin: 8px; font-weight: bold; width: 260px; z-index: 60; touch-action: manipulation; }
        .btn:active { background: #1d4ed8; transform: scale(0.98); }
        .btn-secondary { background: #475569; }
        
        input { padding: 14px; font-size: 1rem; border-radius: 8px; border: 1px solid #475569; background: #1e293b; color: white; margin: 8px; width: 260px; text-align: center; z-index: 60; }
        
        #game-ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; flex-direction: column; z-index: 1; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; background: rgba(15, 23, 42, 0.9); border-bottom: 1px solid #334155; z-index: 5; }
        .header-controls { display: flex; align-items: center; gap: 10px; position: relative; }
        
        .mic-switch { background: #ef4444; color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.9rem; }
        .mic-switch.active { background: #22c55e; }
        
        .icon-btn { background: #334155; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 1rem; }
        
        #target-voice-container { position: absolute; top: 50px; right: 0; background: #1e293b; border: 1px solid #475569; border-radius: 8px; padding: 10px; width: 220px; max-height: 150px; overflow-y: auto; z-index: 100; display: none; }
        #target-voice-container h4 { font-size: 0.85rem; margin-bottom: 6px; color: #94a3b8; border-bottom: 1px solid #334155; padding-bottom: 4px; }
        .target-item { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; margin: 4px 0; }

        canvas { flex-grow: 1; display: block; background: #1e293b; }

        #mobile-controls { position: absolute; bottom: 20px; width: 100%; display: flex; justify-content: space-between; padding: 0 30px; z-index: 10; pointer-events: none; }
        .touch-group { display: flex; gap: 15px; pointer-events: auto; }
        .touch-btn { width: 75px; height: 75px; background: rgba(51, 65, 85, 0.85); border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; color: white; font-size: 1.6rem; display: flex; align-items: center; justify-content: center; cursor: pointer; user-select: none; touch-action: manipulation; }
        .touch-btn:active { background: rgba(37, 99, 235, 0.9); }

        #settings-modal { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 200; }
        .modal-content { background: #1e293b; padding: 30px; border-radius: 12px; width: 380px; border: 1px solid #475569; display: flex; flex-direction: column; gap: 15px; }
        .setting-row { display: flex; flex-direction: column; gap: 5px; font-size: 0.9rem; }
    </style>
</head>
<body>

    <!-- 最初の画面（ここから音楽が鳴るようにタッチ/クリックを検知） -->
    <div id="mode-screen" class="screen">
        <h1>OnlinePlat</h1>
        <div class="instructions">
            <b>【操作方法】</b><br>
            ・<b>移動/ジャンプ</b>: 画面下のボタン、またはPCキーボード(A/D/Space)<br>
            ・<b>BGM</b>: 画面のどこかをタッチ/クリックすると再生されます
        </div>
        <input type="text" id="player-name" placeholder="プレイヤー名" value="Player">
        <button class="btn" id="btn-offline">オフライン</button>
        <button class="btn" id="btn-online">オンライン</button>
        <button class="btn btn-secondary" id="btn-private-menu">プライベート</button>
    </div>

    <div id="private-screen" class="screen hidden">
        <h1>プライベート部屋</h1>
        <input type="text" id="room-code-input" placeholder="部屋番号 (例: 1234)">
        <button class="btn" id="btn-private-join">ホスト / 入出</button>
        <button class="btn btn-secondary" id="btn-back">戻る</button>
    </div>

    <div id="game-ui">
        <header>
            <div id="room-info" style="font-weight: bold; color: #38bdf8;">OnlinePlat</div>
            <div class="header-controls">
                <button id="mic-toggle-btn" class="mic-switch">マイク OFF</button>
                <button class="icon-btn" id="btn-target-toggle">👥 送信先</button>
                <button class="icon-btn" id="btn-settings-open">⚙️ 設定</button>

                <div id="target-voice-container">
                    <h4>ボイス送信先選択</h4>
                    <div class="target-item">
                        <input type="checkbox" id="select-all-target" checked>
                        <label for="select-all-target">全員に送信</label>
                    </div>
                    <div id="target-checkboxes"></div>
                </div>
            </div>
        </header>

        <canvas id="gameCanvas"></canvas>

        <div id="mobile-controls">
            <div class="touch-group">
                <div class="touch-btn" id="btn-left">◀</div>
                <div class="touch-btn" id="btn-right">▶</div>
            </div>
            <div class="touch-group">
                <div class="touch-btn" id="btn-jump">▲</div>
            </div>
        </div>
    </div>

    <div id="settings-modal">
        <div class="modal-content">
            <h3 style="color: #38bdf8;">設定</h3>
            <div class="setting-row">
                <label>BGM 音量: <span id="bgm-val">50</span>%</label>
                <input type="range" id="range-bgm" min="0" max="100" value="50">
            </div>
            <div class="setting-row">
                <label>効果音音量: <span id="sfx-val">70</span>%</label>
                <input type="range" id="range-sfx" min="0" max="100" value="70">
            </div>
            <div class="setting-row">
                <label>マイク検知量: <span id="mic-sens-val">30</span></label>
                <input type="range" id="range-mic" min="0" max="100" value="30">
            </div>
            <div class="setting-row">
                <label>相手の声の音量: <span id="voice-vol-val">80</span>%</label>
                <input type="range" id="range-voice" min="0" max="100" value="80">
            </div>
            <button class="btn btn-secondary" id="btn-settings-close">閉じる</button>
            <button class="btn" style="background: #ef4444;" id="btn-exit">ゲームを退出</button>
        </div>
    </div>

    <audio id="bgm-player" autoplay loop></audio>

    <script>
        const keys = {};

        window.addEventListener('keydown', e => { keys[e.code] = true; keys[e.key.toLowerCase()] = true; });
        window.addEventListener('keyup', e => { keys[e.code] = false; keys[e.key.toLowerCase()] = false; });

        function setupTouchButton(id, keyName) {
            const el = document.getElementById(id);
            if (!el) return;
            const start = (e) => { e.preventDefault(); keys[keyName] = true; };
            const end = (e) => { e.preventDefault(); keys[keyName] = false; };
            el.addEventListener('mousedown', start);
            el.addEventListener('mouseup', end);
            el.addEventListener('mouseleave', end);
            el.addEventListener('touchstart', start, {passive: false});
            el.addEventListener('touchend', end, {passive: false});
        }

        setupTouchButton('btn-left', 'ArrowLeft');
        setupTouchButton('btn-right', 'ArrowRight');
        setupTouchButton('btn-jump', 'Space');

        let socket = null;
        let gameMode = 'offline';
        let roomCode = '';
        let playerName = 'Player';
        let players = {};
        let myId = null;

        let bgmTracks = [];
        let currentTrackIndex = 0;
        let bgmVolume = 0.5;
        let voiceVolume = 0.8;
        let micActive = false;
        let localStream = null;
        let peerConnections = {};
        let selectedVoiceTargets = 'all';

        // 最初の画面からBGMをロード＆自動再生トライ
        window.addEventListener('DOMContentLoaded', () => {
            initBGM();
            // ユーザーが画面のどこかを最初に触った瞬間に強制再生（ブラウザ制限対策）
            const unlockAudio = () => {
                const player = document.getElementById('bgm-player');
                if (player.paused && bgmTracks.length > 0) {
                    player.play().catch(e => {});
                }
                window.removeEventListener('click', unlockAudio);
                window.removeEventListener('touchstart', unlockAudio);
            };
            window.addEventListener('click', unlockAudio);
            window.addEventListener('touchstart', unlockAudio);
        });

        async function initBGM() {
            try {
                const res = await fetch('/api/bgm-tracks');
                const data = await res.json();
                bgmTracks = data.tracks || [];
                if (bgmTracks.length > 0) playNextBgm();
            } catch (e) {}
        }

        const bgmPlayer = document.getElementById('bgm-player');
        bgmPlayer.addEventListener('ended', () => {
            currentTrackIndex = (currentTrackIndex + 1) % bgmTracks.length;
            playNextBgm();
        });

        function playNextBgm() {
            if (bgmTracks.length === 0) return;
            bgmPlayer.src = bgmTracks[currentTrackIndex].previewUrl;
            bgmPlayer.volume = bgmVolume;
            bgmPlayer.play().catch(e => {});
        }

        function updateBgmVolume(val) { bgmVolume = val / 100; bgmPlayer.volume = bgmVolume; document.getElementById('bgm-val').innerText = val; }
        function updateSfxVolume(val) { document.getElementById('sfx-val').innerText = val; }
        function updateMicSensitivity(val) { document.getElementById('mic-sens-val').innerText = val; }
        function updateVoiceVolume(val) { 
            voiceVolume = val / 100; 
            document.getElementById('voice-vol-val').innerText = val;
            document.querySelectorAll('audio.peer-audio').forEach(el => el.volume = voiceVolume);
        }

        // ボタンのイベントリスナー（確実に発火するように修正）
        document.getElementById('btn-offline').addEventListener('click', () => selectMode('offline'));
        document.getElementById('btn-online').addEventListener('click', () => selectMode('online'));
        document.getElementById('btn-private-menu').addEventListener('click', () => {
            document.getElementById('mode-screen').classList.add('hidden');
            document.getElementById('private-screen').classList.remove('hidden');
        });
        document.getElementById('btn-back').addEventListener('click', () => {
            document.getElementById('private-screen').classList.add('hidden');
            document.getElementById('mode-screen').classList.remove('hidden');
        });
        document.getElementById('btn-private-join').addEventListener('click', () => {
            const code = document.getElementById('room-code-input').value.trim();
            if (!code) { alert('部屋番号を入力してください'); return; }
            roomCode = code;
            gameMode = 'private';
            startGame();
        });

        document.getElementById('mic-toggle-btn').addEventListener('click', toggleMic);
        document.getElementById('btn-target-toggle').addEventListener('click', toggleTargetList);
        document.getElementById('btn-settings-open').addEventListener('click', () => document.getElementById('settings-modal').style.display = 'flex');
        document.getElementById('btn-settings-close').addEventListener('click', () => document.getElementById('settings-modal').style.display = 'none');
        document.getElementById('btn-exit').addEventListener('click', () => location.reload());
        document.getElementById('select-all-target').addEventListener('change', (e) => toggleAllTargets(e.target));

        document.getElementById('range-bgm').addEventListener('input', (e) => updateBgmVolume(e.target.value));
        document.getElementById('range-sfx').addEventListener('input', (e) => updateSfxVolume(e.target.value));
        document.getElementById('range-mic').addEventListener('input', (e) => updateMicSensitivity(e.target.value));
        document.getElementById('range-voice').addEventListener('input', (e) => updateVoiceVolume(e.target.value));

        function selectMode(mode) {
            gameMode = mode;
            startGame();
        }

        function startGame() {
            const nameInput = document.getElementById('player-name').value.trim();
            if (nameInput) playerName = nameInput;

            document.getElementById('mode-screen').classList.add('hidden');
            document.getElementById('private-screen').classList.add('hidden');
            document.getElementById('game-ui').style.display = 'flex';
            document.getElementById('room-info').innerText = `OnlinePlat - ${gameMode.toUpperCase()} ${roomCode ? '('+roomCode+')':''}`;

            initSocket();
            initCanvas();
            initMic();
        }

        function initSocket() {
            socket = io();
            socket.on('connect', () => {
                myId = socket.id;
                // 初期位置を地面（y: 450付近）に合わせる
                socket.emit('join_room', { mode: gameMode, roomCode: roomCode, playerData: { name: playerName, x: 100, y: 400, color: '#38bdf8' } });
            });
            socket.on('update_players', (serverPlayers) => {
                players = serverPlayers;
                updateTargetCheckboxes();
                syncVoiceConnections();
            });
            socket.on('player_moved', ({ id, data }) => {
                if (players[id]) { players[id].x = data.x; players[id].y = data.y; }
            });
            socket.on('voice_signal', async ({ signal, from, targetOnly }) => {
                if (targetOnly && targetOnly !== 'all' && !targetOnly.includes(myId)) return;
                let pc = peerConnections[from] || createPeerConnection(from);
                if (signal.sdp) {
                    await pc.setRemoteDescription(new RTCSessionDescription(signal.sdp));
                    if (signal.sdp.type === 'offer') {
                        const answer = await pc.createAnswer();
                        await pc.setLocalDescription(answer);
                        socket.emit('voice_signal', { to: from, signal: { sdp: pc.localDescription }, from: myId, targetOnly: selectedVoiceTargets });
                    }
                } else if (signal.candidate) {
                    await pc.addIceCandidate(new RTCIceCandidate(signal.candidate));
                }
            });

            // タブをいきなり閉じたりリロードしたとき即座にサーバーから切断・削除させる
            window.addEventListener('beforeunload', () => {
                if (socket) socket.disconnect();
            });
        }

        async function initMic() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                localStream.getAudioTracks()[0].enabled = false;
            } catch (e) {}
        }

        function toggleMic() {
            if (!localStream) { alert('マイクが許可されていないか接続されていません。'); return; }
            micActive = !micActive;
            localStream.getAudioTracks()[0].enabled = micActive;
            const btn = document.getElementById('mic-toggle-btn');
            btn.innerText = micActive ? 'マイク ON' : 'マイク OFF';
            btn.classList.toggle('active', micActive);
        }

        function createPeerConnection(id) {
            const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
            if (localStream) {
                localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
            }
            pc.onicecandidate = event => {
                if (event.candidate) {
                    socket.emit('voice_signal', { to: id, signal: { candidate: event.candidate }, from: myId, targetOnly: selectedVoiceTargets });
                }
            };
            pc.ontrack = event => {
                let audio = document.getElementById('audio_' + id);
                if (!audio) {
                    audio = document.createElement('audio');
                    audio.id = 'audio_' + id;
                    audio.className = 'peer-audio';
                    audio.autoplay = true;
                    audio.volume = voiceVolume;
                    document.body.appendChild(audio);
                }
                audio.srcObject = event.streams[0];
            };
            peerConnections[id] = pc;
            return pc;
        }

        async function syncVoiceConnections() {
            if (!socket) return;
            for (let id in players) {
                if (id !== myId && !peerConnections[id]) {
                    let pc = createPeerConnection(id);
                    const offer = await pc.createOffer();
                    await pc.setLocalDescription(offer);
                    socket.emit('voice_signal', { to: id, signal: { sdp: pc.localDescription }, from: myId, targetOnly: selectedVoiceTargets });
                }
            }
        }

        function toggleTargetList() {
            const el = document.getElementById('target-voice-container');
            el.style.display = el.style.display === 'block' ? 'none' : 'block';
        }

        function updateTargetCheckboxes() {
            const container = document.getElementById('target-checkboxes');
            container.innerHTML = '';
            for (let id in players) {
                if (id === myId) continue;
                const p = players[id];
                const div = document.createElement('div');
                div.className = 'target-item';
                div.innerHTML = `<input type="checkbox" value="${id}" class="target-chk" checked> <label>${p.name}</label>`;
                container.appendChild(div);
                div.querySelector('input').addEventListener('change', calcVoiceTargets);
            }
        }

        function toggleAllTargets(master) {
            document.querySelectorAll('.target-chk').forEach(c => c.checked = master.checked);
            calcVoiceTargets();
        }

        function calcVoiceTargets() {
            const master = document.getElementById('select-all-target');
            if (master.checked) { selectedVoiceTargets = 'all'; return; }
            const chks = document.querySelectorAll('.target-chk:checked');
            selectedVoiceTargets = Array.from(chks).map(c => c.value);
        }

        function initCanvas() {
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight - 50; }
            window.addEventListener('resize', resize);
            resize();

            // 初期位置を地面の上(y: 400)に設定し、空中浮遊を解消
            let myX
