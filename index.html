<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OnlinePlat</title><script src="/socket.io/socket.io.js"></script>
    <style>
        *{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-tap-highlight-color:transparent;}
        body{background:#0f172a;color:#f8fafc;font-family:sans-serif;overflow:hidden;width:100vw;height:100vh;}
        .screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0f172a;z-index:1000;}
        .hidden{display:none!important;}
        .btn{background:#2563eb;color:#fff;border:none;padding:12px 20px;font-size:1rem;border-radius:8px;cursor:pointer;margin:6px;width:240px;font-weight:bold;pointer-events:auto;}
        input{padding:12px;font-size:1rem;border-radius:8px;border:1px solid #475569;background:#1e293b;color:#fff;margin:6px;width:240px;text-align:center;pointer-events:auto;}
        #game-ui{position:absolute;inset:0;display:none;flex-direction:column;z-index:10;pointer-events:none;}
        header{display:flex;justify-content:space-between;align-items:center;padding:10px 20px;background:rgba(15,23,42,0.9);border-bottom:1px solid #334155;pointer-events:auto;z-index:20;}
        .icon-btn,.mic-switch{background:#334155;color:#fff;border:none;padding:8px 12px;border-radius:6px;cursor:pointer;font-weight:bold;pointer-events:auto;}
        .mic-switch.active{background:#22c55e;}
        canvas{flex-grow:1;display:block;background:#1e293b;pointer-events:auto;}
        #emote-panel{position:absolute;bottom:100px;left:20px;background:rgba(30,41,59,0.9);border:1px solid #475569;border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:4px;pointer-events:auto;z-index:20;}
        .emote-btn{background:#334155;color:#fff;border:none;padding:6px 10px;border-radius:4px;cursor:pointer;text-align:left;font-size:0.9rem;}
        #controls{position:absolute;bottom:20px;width:100%;display:flex;justify-content:space-between;padding:0 30px;pointer-events:none;z-index:20;}
        .t-btn{width:65px;height:65px;background:rgba(51,65,85,0.85);border:2px solid rgba(255,255,255,0.3);border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.1rem;font-weight:bold;pointer-events:auto;cursor:pointer;}
        #settings-modal{position:absolute;inset:0;background:rgba(0,0,0,0.7);display:none;align-items:center;justify-content:center;z-index:2000;pointer-events:auto;}
        .modal-content{background:#1e293b;padding:25px;border-radius:10px;width:340px;border:1px solid #475569;display:flex;flex-direction:column;gap:12px;}
        .v-tag{position:fixed;bottom:10px;right:15px;color:#38bdf8;font-weight:bold;font-size:0.85rem;z-index:3000;background:rgba(15,23,42,0.8);padding:4px 8px;border-radius:4px;border:1px solid #334155;pointer-events:none;}
        #target-voice-container{position:absolute;top:45px;right:0;background:#1e293b;border:1px solid #475569;border-radius:8px;padding:8px;width:200px;display:none;pointer-events:auto;z-index:30;}
    </style>
</head>
<body>
    <div id="mode-screen" class="screen">
        <h1>OnlinePlat</h1>
        <p style="color:#94a3b8;font-size:0.85rem;margin-bottom:10px;">操作: 左=z, 右=c, しゃがみ=x, ジャンプ=s</p>
        <input type="text" id="p-name" value="Player">
        <button class="btn" id="b-off">オフライン</button>
        <button class="btn" id="b-on">オンライン</button>
        <button class="btn" style="background:#475569;" id="b-priv-menu">プライベート</button>
    </div>

    <div id="priv-screen" class="screen hidden">
        <h1>プライベート部屋</h1>
        <input type="text" id="room-code" placeholder="部屋番号 (例: 1234)">
        <button class="btn" id="b-priv-join">参加 / ホスト</button>
        <button class="btn" style="background:#475569;" id="b-back">戻る</button>
    </div>

    <div id="game-ui">
        <header>
            <div id="room-info" style="font-weight:bold;color:#38bdf8;">OnlinePlat</div>
            <div style="display:flex;gap:8px;position:relative;">
                <button id="mic-btn" class="mic-switch">マイク OFF</button>
                <button class="icon-btn" id="target-toggle">👥 送信先</button>
                <button class="icon-btn" id="settings-open">⚙️ 設定</button>
                <div id="target-voice-container">
                    <div style="font-size:0.8rem;color:#94a3b8;margin-bottom:4px;">ボイス送信先</div>
                    <div><input type="checkbox" id="all-target" checked> <label>全員</label></div>
                    <div id="target-checkboxes"></div>
                </div>
            </div>
        </header>

        <div id="emote-panel">
            <div style="font-size:0.75rem;color:#94a3b8;text-align:center;">エモート</div>
            <button class="emote-btn" data-e="👍 ナイス！">👍 ナイス！</button>
            <button class="emote-btn" data-e="😂 草w">😂 草w</button>
            <button class="emote-btn" data-e="🔥 やる気！">🔥 やる気！</button>
            <button class="emote-btn" data-e="💖 ありがと">💖 ありがと</button>
            <button class="emote-btn" data-e="👋 お疲れ！">👋 お疲れ！</button>
        </div>

        <canvas id="canvas"></canvas>

        <div id="controls">
            <div style="display:flex;gap:12px;"><div class="t-btn" id="t-z">左:z</div><div class="t-btn" id="t-c">右:c</div></div>
            <div style="display:flex;gap:12px;"><div class="t-btn" id="t-x" style="background:rgba(100,116,139,0.8);">しゃが:x</div><div class="t-btn" id="t-s" style="background:rgba(37,99,235,0.8);">ジャンプ:s</div></div>
        </div>
    </div>

    <div id="settings-modal">
        <div class="modal-content">
            <h3 style="color:#38bdf8;">設定</h3>
            <div>
                <label style="font-size:0.85rem;">BGMアーティスト (200曲):</label>
                <input type="text" id="artist-input" value="Dragon Quest" style="width:100%;margin-top:4px;">
                <button class="btn" id="change-artist" style="width:100%;padding:8px;margin-top:4px;">更新</button>
            </div>
            <div>
                <label style="font-size:0.85rem;">BGM音量: <span id="bgm-v">50</span>%</label>
                <input type="range" id="range-bgm" min="0" max="100" value="50" style="width:100%;">
            </div>
            <div>
                <label style="font-size:0.85rem;">効果音音量: <span id="sfx-v">70</span>%</label>
                <input type="range" id="range-sfx" min="0" max="100" value="70" style="width:100%;">
            </div>
            <div>
                <label style="font-size:0.85rem;">相手の声音量: <span id="voice-v">80</span>%</label>
                <input type="range" id="range-voice" min="0" max="100" value="80" style="width:100%;">
            </div>
            <button class="btn" style="background:#475569;width:100%;" id="settings-close">閉じる</button>
            <button class="btn" style="background:#ef4444;width:100%;" id="exit-btn">ゲームを退出</button>
        </div>
    </div>

    <div class="v-tag">v0.1.0</div>
    <audio id="bgm" autoplay loop></audio>

    <script>
        const keys = {};
        window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

        function bindTouch(id, k1, k2) {
            const el = document.getElementById(id);
            if(!el) return;
            ['mousedown','touchstart'].forEach(ev => el.addEventListener(ev, e => { e.preventDefault(); keys[k1]=true; keys[k2]=true; }));
            ['mouseup','touchend','mouseleave'].forEach(ev => el.addEventListener(ev, e => { e.preventDefault(); keys[k1]=false; keys[k2]=false; }));
        }
        bindTouch('t-z', 'z', 'keyz'); bindTouch('t-c', 'c', 'keyc');
        bindTouch('t-x', 'x', 'keyx'); bindTouch('t-s', 's', 'keys');

        let socket, myId, players = {}, tracks = [], trackIdx = 0, artist = 'Dragon Quest';
        let bgmV = 0.5, sfxV = 0.7, voiceV = 0.8, micActive = false, localStream = null, pcs = {}, targets = 'all', emote = '';

        window.addEventListener('DOMContentLoaded', () => {
            loadBgm(artist);
            const unlock = () => { if(bgm.paused && tracks.length) bgm.play().catch(()=>{}); };
            window.addEventListener('click', unlock, {once:true}); window.addEventListener('touchstart', unlock, {once:true});

            document.getElementById('b-off').addEventListener('click', () => startGame('offline', ''));
            document.getElementById('b-on').addEventListener('click', () => startGame('online', ''));
            document.getElementById('b-priv-menu').addEventListener('click', () => { document.getElementById('mode-screen').classList.add('hidden'); document.getElementById('priv-screen').classList.remove('hidden'); });
            document.getElementById('b-back').addEventListener('click', () => { document.getElementById('priv-screen').classList.add('hidden'); document.getElementById('mode-screen').classList.remove('hidden'); });
            document.getElementById('b-priv-join').addEventListener('click', () => { const code = document.getElementById('room-code').value.trim(); if(code) startGame('private', code); });

            document.getElementById('mic-btn').addEventListener('click', toggleMic);
            document.getElementById('target-toggle').addEventListener('click', () => { const tc = document.getElementById('target-voice-container'); tc.style.display = tc.style.display==='block'?'none':'block'; });
            document.getElementById('settings-open').addEventListener('click', () => document.getElementById('settings-modal').style.display = 'flex');
            document.getElementById('settings-close').addEventListener('click', () => document.getElementById('settings-modal').style.display = 'none');
            document.getElementById('exit-btn').addEventListener('click', () => location.reload());
            document.getElementById('change-artist').addEventListener('click', () => { const val = document.getElementById('artist-input').value.trim(); if(val){ artist = val; loadBgm(artist); } });

            document.querySelectorAll('.emote-btn').forEach(b => b.addEventListener('click', () => sendEmote(b.dataset.e)));
            document.getElementById('all-target').addEventListener('change', e => { document.querySelectorAll('.target-chk').forEach(c => c.checked = e.target.checked); calcTargets(); });

            document.getElementById('range-bgm').addEventListener('input', e => { bgmV = e.target.value/100; bgm.volume = bgmV; document.getElementById('bgm-v').innerText = e.target.value; });
            document.getElementById('range-sfx').addEventListener('input', e => { sfxV = e.target.value/100; document.getElementById('sfx-v').innerText = e.target.value; });
            document.getElementById('range-voice').addEventListener('input', e => { voiceV = e.target.value/100; document.getElementById('voice-v').innerText = e.target.value; document.querySelectorAll('audio.peer-audio').forEach(a => a.volume = voiceV); });
        });

        async function loadBgm(art) {
            try {
                const res = await fetch(`/api/bgm-tracks?artist=${encodeURIComponent(art)}`);
                const d = await res.json(); tracks = d.tracks || []; trackIdx = 0;
                if(tracks.length) playBgm();
            } catch(e){}
        }

        const bgm = document.getElementById('bgm');
        bgm.addEventListener('ended', () => { trackIdx = (trackIdx + 1) % tracks.length; playBgm(); });
        function playBgm() { if(!tracks.length) return; bgm.src = tracks[trackIdx].previewUrl; bgm.volume = bgmV; bgm.play().catch(()=>{}); }

        function playJumpSfx() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator(); const gain = ctx.createGain();
                osc.type = 'square'; osc.frequency.setValueAtTime(300, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(600, ctx.currentTime + 0.15);
                gain.gain.setValueAtTime(sfxV * 0.3, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
                osc.connect(gain); gain.connect(ctx.destination);
                osc.start(); osc.stop(ctx.currentTime + 0.15);
            } catch(e){}
        }

        function sendEmote(txt) {
            emote = txt; if(socket?.connected) socket.emit('player_emote', emote);
            setTimeout(() => { emote = ''; if(socket?.connected) socket.emit('player_emote', ''); }, 3500);
        }

        function startGame(mode, code) {
            const name = document.getElementById('p-name').value.trim() || 'Player';
            document.getElementById('mode-screen').classList.add('hidden');
            document.getElementById('priv-screen').classList.add('hidden');
            document.getElementById('game-ui').style.display = 'flex';
            document.getElementById('room-info').innerText = `OnlinePlat - ${mode.toUpperCase()} ${code?'('+code+')':''}`;
            initSocket(mode, code, name); initCanvas(); initMic();
        }

        function initSocket(mode, code, name) {
            socket = io();
            socket.on('connect', () => {
                myId = socket.id;
                socket.emit('join_room', { mode, roomCode: code, playerData: { name, x: 100, y: 1500, emote: '' } });
            });
            socket.on('update_players', p => { players = p; updateTargets(); syncVoice(); });
            socket.on('player_moved', ({id, data}) => { if(players[id]) Object.assign(players[id], data); });
            socket.on('voice_signal', async ({signal, from, targetOnly}) => {
                if(targetOnly !== 'all' && !targetOnly.includes(myId)) return;
                let pc = pcs[from] || createPC(from);
                if(signal.sdp) {
                    await pc.setRemoteDescription(new RTCSessionDescription(signal.sdp));
                    if(signal.sdp.type === 'offer') {
                        const ans = await pc.createAnswer(); await pc.setLocalDescription(ans);
                        socket.emit('voice_signal', {to: from, signal: {sdp: pc.localDescription}, from: myId, targetOnly: targets});
                    }
                } else if(signal.candidate) { await pc.addIceCandidate(new RTCIceCandidate(signal.candidate)); }
            });
        }

        async function initMic() {
            try { localStream = await navigator.mediaDevices.getUserMedia({audio:true, video:false}); localStream.getAudioTracks()[0].enabled = false; } catch(e){}
        }

        function toggleMic() {
            const btn = document.getElementById('mic-btn');
            if(!localStream) {
                navigator.mediaDevices.getUserMedia({audio:true, video:false}).then(s => {
                    localStream = s; localStream.getAudioTracks()[0].enabled = true; micActive = true;
                    btn.innerText = 'マイク ON'; btn.classList.add('active'); syncVoice();
                }).catch(() => {});
                return;
            }
            micActive = !micActive; localStream.getAudioTracks()[0].enabled = micActive;
            btn.innerText = micActive ? 'マイク ON' : 'マイク OFF'; btn.classList.toggle('active', micActive);
        }

        function createPC(id) {
            const pc = new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});
            if(localStream) localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
            pc.onicecandidate = e => { if(e.candidate) socket.emit('voice_signal', {to: id, signal: {candidate: e.candidate}, from: myId, targetOnly: targets}); };
            pc.ontrack = e => {
                let audio = document.getElementById('audio_' + id);
                if(!audio) {
                    audio = document.createElement('audio'); audio.id = 'audio_' + id;
                    audio.className = 'peer-audio'; audio.autoplay = true; audio.volume = voiceV;
                    document.body.appendChild(audio);
                }
                audio.srcObject = e.streams[0];
            };
            pcs[id] = pc; return pc;
        }

        async function syncVoice() {
            if(!socket) return;
            for(let id in players) {
                if(id !== myId && !pcs[id] && myId < id) {
                    const pc = createPC(id); const offer = await pc.createOffer();
                    await pc.setLocalDescription(offer);
                    socket.emit('voice_signal', {to: id, signal: {sdp: pc.localDescription}, from: myId, targetOnly: targets});
                }
            }
        }

        function updateTargets() {
            const container = document.getElementById('target-checkboxes'); container.innerHTML = '';
            for(let id in players) {
                if(id === myId) continue;
                const div = document.createElement('div');
                div.innerHTML = `<input type="checkbox" value="${id}" class="target-chk" checked> <label>${players[id].name}</label>`;
                container.appendChild(div);
                div.querySelector('input').addEventListener('change', calcTargets);
            }
        }

        function calcTargets() {
            if(document.getElementById('all-target').checked) { targets = 'all'; return; }
            targets = Array.from(document.querySelectorAll('.target-chk:checked')).map(c => c.value);
        }

        function initCanvas() {
            const canvas = document.getElementById('canvas'); const ctx = canvas.getContext('2d');
            const resize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight - 50; };
            window.addEventListener('resize', resize); resize();

            let x = 100, y = 1500, vx = 0, vy = 0, grounded = false;
            const plats = [
                {x:-2000, y:1600, w:12000, h:100}, {x:300, y:1450, w:180, h:20}, {x:550, y:1320, w:150, h:20},
                {x:800, y:1180, w:120, h:20}, {x:1050, y:1050, w:150, h:20}, {x:1300, y:920, w:180, h:20},
                {x:1600, y:800, w:100, h:20}, {x:1850, y:700, w:100, h:20}, {x:2100, y:600, w:100, h:20},
                {x:2400, y:500, w:800, h:30}, {x:2600, y:380, w:150, h:20}, {x:2900, y:280, w:150, h:20},
                {x:3200, y:180, w:300, h:20}, {x:3700, y:300, w:80, h:20}, {x:3900, y:450, w:80, h:20},
                {x:4100, y:600, w:80, h:20}, {x:4300, y:750, w:80, h:20}, {x:4600, y:900, w:1000, h:30}
            ];

            function loop() {
                const left = keys['z'] || keys['keyz']; const right = keys['c'] || keys['keyc'];
                const crouch = keys['x'] || keys['keyx']; const jump = keys['s'] || keys['keys'] || keys[' '];

                vx = left ? -6 : (right ? 6 : 0); let h = 40;
                if(crouch) { h = 20; vx *= 0.4; }
                if(jump && grounded) { vy = -12; grounded = false; playJumpSfx(); }
                vy += 0.55; x += vx; y += vy;

                grounded = false;
                plats.forEach(p => {
                    if(x + 30 > p.x && x < p.x + p.w && y + h >= p.y && y + h <= p.y + p.h + 15 && vy >= 0) {
                        y = p.y - h; vy = 0; grounded = true;
                    }
                });
                if(y > 2000) { x = 100; y = 1500; vy = 0; }

                if(socket?.connected) socket.emit('player_move', {x, y, h, emote});

                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.save(); ctx.translate(-x + canvas.width/2, -y + canvas.height/2);

                ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 2;
                for(let i = -2000; i < 10000; i += 200) { ctx.beginPath(); ctx.moveTo(i, -1000); ctx.lineTo(i, 2500); ctx.stroke(); }

                ctx.fillStyle = '#475569'; plats.forEach(p => ctx.fillRect(p.x, p.y, p.w, p.h));

                if(players[myId]) { players[myId].x = x; players[myId].y = y; players[myId].h = h; players[myId].emote = emote; }
                for(let id in players) {
                    const p = players[id]; const ph = p.h || 40;
                    ctx.fillStyle = id === myId ? '#38bdf8' : '#f43f5e';
                    ctx.fillRect(p.x, p.y + (40 - ph), 30, ph);
                    if(p.emote) {
                        ctx.fillStyle = 'rgba(255,255,255,0.9)'; ctx.fillRect(p.x - 35, p.y - 42, 100, 26);
                        ctx.fillStyle = '#0f172a'; ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'center';
                        ctx.fillText(p.emote, p.x + 15, p.y - 24);
                    }
                    ctx.fillStyle = '#fff'; ctx.font = '12px sans-serif'; ctx.textAlign = 'center';
                    ctx.fillText(p.name, p.x + 15, p.y - 8);
                }
                ctx.restore(); requestAnimationFrame(loop);
            }
            requestAnimationFrame(loop);
        }
    </script>
</body>
</html>
