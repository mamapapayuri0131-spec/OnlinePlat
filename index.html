<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OnlinePlat</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { background: #0f172a; color: #f8fafc; font-family: sans-serif; overflow: hidden; width: 100vw; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        
        .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0f172a; z-index: 10; padding: 20px; text-align: center; }
        .screen.hidden { display: none !important; }
        
        h1 { font-size: 2.5rem; margin-bottom: 10px; color: #38bdf8; }
        .instructions { font-size: 0.95rem; color: #94a3b8; margin-bottom: 20px; line-height: 1.5; background: #1e293b; padding: 12px; border-radius: 8px; border: 1px solid #475569; max-width: 320px; text-align: left; }
        .btn { background: #2563eb; color: white; border: none; padding: 12px 24px; font-size: 1.1rem; border-radius: 8px; cursor: pointer; margin: 6px; font-weight: bold; width: 250px; }
        .btn:hover { background: #1d4ed8; }
        .btn-secondary { background: #475569; }
        
        input { padding: 12px; font-size: 1rem; border-radius: 8px; border: 1px solid #475569; background: #1e293b; color: white; margin: 6px; width: 250px; text-align: center; }
        
        #game-ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; flex-direction: column; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; background: rgba(15, 23, 42, 0.9); border-bottom: 1px solid #334155; z-index: 5; }
        .header-controls { display: flex; align-items: center; gap: 10px; position: relative; }
        
        .mic-switch { background: #ef4444; color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.9rem; }
        .mic-switch.active { background: #22c55e; }
        
        .icon-btn { background: #334155; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 1rem; }
        
        #target-voice-container { position: absolute; top: 50px; right: 0; background: #1e293b; border: 1px solid #475569; border-radius: 8px; padding: 10px; width: 220px; max-height: 150px; overflow-y: auto; z-index: 20; display: none; }
        #target-voice-container h4 { font-size: 0.85rem; margin-bottom: 6px; color: #94a3b8; border-bottom: 1px solid #334155; padding-bottom: 4px; }
        .target-item { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; margin: 4px 0; }

        canvas { flex-grow: 1; display: block; background: #1e293b; }

        #mobile-controls { position: absolute; bottom: 20px; width: 100%; display: flex; justify-content: space-between; padding: 0 30px; z-index: 5; pointer-events: none; }
        .touch-group { display: flex; gap: 15px; pointer-events: auto; }
        .touch-btn { width: 70px; height: 70px; background: rgba(51, 65, 85, 0.85); border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; color: white; font-size: 1.5rem; display: flex; align-items: center; justify-content: center; cursor: pointer; user-select: none; }
        .touch-btn:active { background: rgba(37, 99, 235, 0.9); }

        #settings-modal { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 30; }
        .modal-content { background: #1e293b; padding: 30px; border-radius: 12px; width: 380px; border: 1px solid #475569; display: flex; flex-direction: column; gap: 15px; }
        .setting-row { display: flex; flex-direction: column; gap: 5px; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div id="mode-screen" class="screen">
        <h1>OnlinePlat</h1>
        <div class="instructions">
            <b>【操作方法】</b><br>
            ・<b>キーボード</b>: A/D または ◀/▶ キーで左右移動、Space / W / ▲ キーでジャンプ<br>
            ・<b>画面ボタン</b>: 画面下のボタンをマウスやタッチで操作可能
        </div>
        <input type="text" id="player-name" placeholder="プレイヤー名" value="Player">
        <button class="btn" onclick="selectMode('offline')">オフライン</button>
        <button class="btn" onclick="selectMode('online')">オンライン</button>
        <button class="btn btn-secondary" onclick="showPrivateMenu()">プライベート</button>
    </div>

    <div id="private-screen" class="screen hidden">
        <h1>プライベート部屋</h1>
        <input type="text" id="room-code-input" placeholder="部屋番号 (例: 1234)">
        <button class="btn" onclick="joinPrivate()">ホスト / 入出</button>
        <button class="btn btn-secondary" onclick="backToMain()">戻る</button>
    </div>

    <div id="game-ui">
        <header>
            <div id="room-info" style="font-weight: bold; color: #38bdf8;">OnlinePlat</div>
            <div class="header-controls">
                <button id="mic-toggle-btn" class="mic-switch" onclick="toggleMic()">マイク OFF</button>
                <button class="icon-btn" onclick="toggleTargetList()">👥 送信先</button>
                <button class="icon-btn" onclick="openSettings()">⚙️ 設定</button>

                <div id="target-voice-container">
                    <h4>ボイス送信先選択</h4>
                    <div class="target-item">
                        <input type="checkbox" id="select-all-target" checked onchange="toggleAllTargets(this)">
                        <label for="select-all-target">全員に送信</label>
                    </div>
                    <div id="target-checkboxes"></div>
                </div>
            </div>
        </header>

        <canvas id="gameCanvas"></canvas>

        <div id="mobile-controls">
            <div class="touch-group">
                <div class="touch-btn" id="btn-left">◀</div>
                <div class="touch-btn" id="btn-right">▶</div>
            </div>
            <div class="touch-group">
                <div class="touch-btn" id="btn-jump">▲</div>
            </div>
        </div>
    </div>

    <div id="settings-modal">
        <div class="modal-content">
            <h3 style="color: #38bdf8;">設定</h3>
            <div class="setting-row">
                <label>BGM 音量: <span id="bgm-val">50</span>%</label>
                <input type="range" min="0" max="100" value="50" oninput="updateBgmVolume(this.value)">
            </div>
            <div class="setting-row">
                <label>効果音音量: <span id="sfx-val">70</span>%</label>
                <input type="range" min="0" max="100" value="70" oninput="updateSfxVolume(this.value)">
            </div>
            <div class="setting-row">
                <label>マイク検知量: <span id="mic-sens-val">30</span></label>
                <input type="range" min="0" max="100" value="30" oninput="updateMicSensitivity(this.value)">
            </div>
            <div class="setting-row">
                <label>相手の声の音量: <span id="voice-vol-val">80</span>%</label>
                <input type="range" min="0" max="100" value="80" oninput="updateVoiceVolume(this.value)">
            </div>
            <button class="btn btn-secondary" onclick="closeSettings()">閉じる</button>
            <button class="btn" style="background: #ef4444;" onclick="location.reload()">ゲームを退出</button>
        </div>
    </div>

    <audio id="bgm-player" autoplay></audio>

    <script>
        const keys = {};

        window.addEventListener('keydown', e => { keys[e.code] = true; keys[e.key.toLowerCase()] = true; });
        window.addEventListener('keyup', e => { keys[e.code] = false; keys[e.key.toLowerCase()] = false; });

        function bindButton(id, keyName) {
            const el = document.getElementById(id);
            if (!el) return;
            const start = (e) => { e.preventDefault(); keys[keyName] = true; };
            const end = (e) => { e.preventDefault(); keys[keyName] = false; };
            el.addEventListener('mousedown', start);
            el.addEventListener('mouseup', end);
            el.addEventListener('touchstart', start);
            el.addEventListener('touchend', end);
        }

        bindButton('btn-left', 'ArrowLeft');
        bindButton('btn-right', 'ArrowRight');
        bindButton('btn-jump', 'Space');

        let socket = null;
        let gameMode = 'offline';
        let roomCode = '';
        let playerName = 'Player';
        let players = {};
        let myId = null;

        let bgmTracks = [];
        let currentTrackIndex = 0;
        let bgmVolume = 0.5;
        let voiceVolume = 0.8;
        let micActive = false;
        let localStream = null;
        let peerConnections = {};
        let selectedVoiceTargets = 'all';

        async function initBGM() {
            try {
                const res = await fetch('/api/bgm-tracks');
                const data = await res.json();
                bgmTracks = data.tracks || [];
                if (bgmTracks.length > 0) playNextBgm();
            } catch (e) {}
        }

        const bgmPlayer = document.getElementById('bgm-player');
        bgmPlayer.addEventListener('ended', () => {
            currentTrackIndex = (currentTrackIndex + 1) % bgmTracks.length;
            playNextBgm();
        });

        function playNextBgm() {
            if (bgmTracks.length === 0) return;
            bgmPlayer.src = bgmTracks[currentTrackIndex].previewUrl;
            bgmPlayer.volume = bgmVolume;
            bgmPlayer.play().catch(e => {
                const resumeBgm = () => {
                    bgmPlayer.play();
                    window.removeEventListener('click', resumeBgm);
                    window.removeEventListener('keydown', resumeBgm);
                };
                window.addEventListener('click', resumeBgm);
                window.addEventListener('keydown', resumeBgm);
            });
        }

        function updateBgmVolume(val) { bgmVolume = val / 100; bgmPlayer.volume = bgmVolume; document.getElementById('bgm-val').innerText = val; }
        function updateSfxVolume(val) { document.getElementById('sfx-val').innerText = val; }
        function updateMicSensitivity(val) { document.getElementById('mic-sens-val').innerText = val; }
        function updateVoiceVolume(val) { 
            voiceVolume = val / 100; 
            document.getElementById('voice-vol-val').innerText = val;
            document.querySelectorAll('audio.peer-audio').forEach(el => el.volume = voiceVolume);
        }

        function selectMode(mode) {
            gameMode = mode;
            playerName = document.getElementById('player-name').value || 'Player';
            startGame();
        }

        function showPrivateMenu() {
            document.getElementById('mode-screen').classList.add('hidden');
            document.getElementById('private-screen').classList.remove('hidden');
        }

        function backToMain() {
            document.getElementById('private-screen').classList.add('hidden');
            document.getElementById('mode-screen').classList.remove('hidden');
        }

        function joinPrivate() {
            const code = document.getElementById('room-code-input').value;
            if (!code) { alert('部屋番号を入力してください'); return; }
            roomCode = code;
            gameMode = 'private';
            playerName = document.getElementById('player-name').value || 'Player';
            startGame();
        }

        function startGame() {
            document.getElementById('mode-screen').classList.add('hidden');
            document.getElementById('private-screen').classList.add('hidden');
            document.getElementById('game-ui').style.display = 'flex';
            document.getElementById('room-info').innerText = `OnlinePlat - ${gameMode.toUpperCase()} ${roomCode ? '('+roomCode+')':''}`;

            initBGM();
            initSocket();
            initCanvas();
            initMic();
        }

        function initSocket() {
            socket = io();
            socket.on('connect', () => {
                myId = socket.id;
                socket.emit('join_room', { mode: gameMode, roomCode: roomCode, playerData: { name: playerName, x: 100, y: 100, color: '#38bdf8' } });
            });
            socket.on('update_players', (serverPlayers) => {
                players = serverPlayers;
                updateTargetCheckboxes();
                syncVoiceConnections();
            });
            socket.on('player_moved', ({ id, data }) => {
                if (players[id]) { players[id].x = data.x; players[id].y = data.y; }
            });
            socket.on('voice_signal', async ({ signal, from, targetOnly }) => {
                if (targetOnly && targetOnly !== 'all' && !targetOnly.includes(myId)) return;
                let pc = peerConnections[from] || createPeerConnection(from);
                if (signal.sdp) {
                    await pc.setRemoteDescription(new RTCSessionDescription(signal.sdp));
                    if (signal.sdp.type === 'offer') {
                        const answer = await pc.createAnswer();
                        await pc.setLocalDescription(answer);
                        socket.emit('voice_signal', { to: from, signal: { sdp: pc.localDescription }, from: myId, targetOnly: selectedVoiceTargets });
                    }
                } else if (signal.candidate) {
                    await pc.addIceCandidate(new RTCIceCandidate(signal.candidate));
                }
            });
        }

        async function initMic() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                localStream.getAudioTracks()[0].enabled = false;
            } catch (e) {}
        }

        function toggleMic() {
            if (!localStream) { alert('マイクが許可されていないか接続されていません。'); return; }
            micActive = !micActive;
            localStream.getAudioTracks()[0].enabled = micActive;
            const btn = document.getElementById('mic-toggle-btn');
            btn.innerText = micActive ? 'マイク ON' : 'マイク OFF';
            btn.classList.toggle('active', micActive);
        }

        function createPeerConnection(id) {
            const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
            if (localStream) {
                localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
            }
            pc.onicecandidate = event => {
                if (event.candidate) {
                    socket.emit('voice_signal', { to: id, signal: { candidate: event.candidate }, from: myId, targetOnly: selectedVoiceTargets });
                }
            };
            pc.ontrack = event => {
                let audio = document.getElementById('audio_' + id);
                if (!audio) {
                    audio = document.createElement('audio');
                    audio.id = 'audio_' + id;
                    audio.className = 'peer-audio';
                    audio.autoplay = true;
                    audio.volume = voiceVolume;
                    document.body.appendChild(audio);
                }
                audio.srcObject = event.streams[0];
            };
            peerConnections[id] = pc;
            return pc;
        }

        async function syncVoiceConnections() {
            if (!socket) return;
            for (let id in players) {
                if (id !== myId && !peerConnections[id]) {
                    let pc = createPeerConnection(id);
                    const offer = await pc.createOffer();
                    await pc.setLocalDescription(offer);
                    socket.emit('voice_signal', { to: id, signal: { sdp: pc.localDescription }, from: myId, targetOnly: selectedVoiceTargets });
                }
            }
        }

        function toggleTargetList() {
            const el = document.getElementById('target-voice-container');
            el.style.display = el.style.display === 'block' ? 'none' : 'block';
        }

        function updateTargetCheckboxes() {
            const container = document.getElementById('target-checkboxes');
            container.innerHTML = '';
            for (let id in players) {
                if (id === myId) continue;
                const p = players[id];
                const div = document.createElement('div');
                div.className = 'target-item';
                div.innerHTML = `<input type="checkbox" value="${id}" class="target-chk" checked onchange="calcVoiceTargets()"> <label>${p.name}</label>`;
                container.appendChild(div);
            }
        }

        function toggleAllTargets(master) {
            document.querySelectorAll('.target-chk').forEach(c => c.checked = master.checked);
            calcVoiceTargets();
        }

        function calcVoiceTargets() {
            const master = document.getElementById('select-all-target');
            if (master.checked) { selectedVoiceTargets = 'all'; return; }
            const chks = document.querySelectorAll('.target-chk:checked');
            selectedVoiceTargets = Array.from(chks).map(c => c.value);
        }

        function openSettings() { document.getElementById('settings-modal').style.display = 'flex'; }
        function closeSettings() { document.getElementById('settings-modal').style.display = 'none'; }

        function initCanvas() {
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight - 50; }
            window.addEventListener('resize', resize);
            resize();

            let myX = 100, myY = 100, vx = 0, vy = 0;
            const speed = 6, jumpForce = -12, gravity = 0.55;
            let grounded = false;

            const platforms = [
                { x: -500, y: 500, w: 3500, h: 50 },
                { x: 300, y: 380, w: 200, h: 20 },
                { x: 600, y: 280, w: 200, h: 20 },
                { x: 900, y: 200, w: 250, h: 20 }
            ];

            function loop() {
                if (keys['ArrowLeft'] || keys['KeyA'] || keys['a']) vx = -speed;
                else if (keys['ArrowRight'] || keys['KeyD'] || keys['d']) vx = speed;
                else vx = 0;

                if ((keys['ArrowUp'] || keys['KeyW'] || keys['w'] || keys['Space'] || keys[' ']) && grounded) {
                    vy = jumpForce;
                    grounded = false;
                }

                vy += gravity;
                myX += vx;
                myY += vy;

                grounded = false;
                platforms.forEach(p => {
                    if (myX + 30 > p.x && myX < p.x + p.w && myY + 40 >= p.y && myY + 40 <= p.y + p.h + 15 && vy >= 0) {
                        myY = p.y - 40;
                        vy = 0;
                        grounded = true;
                    }
                });

                // 落下時に確実にリスポーンする判定 (地面より下に落ちたら即リスポーン)
                if (myY > 700) {
                    myY = 100;
                    myX = 100;
                    vy = 0;
                    vx = 0;
                }

                if (socket && socket.connected) {
                    socket.emit('player_move', { x: myX, y: myY });
                }

                const cameraX = myX - canvas.width / 2 + 15;
                const cameraY = myY - canvas.height / 2 + 20;

                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.save();
                ctx.translate(-cameraX, -cameraY);

                ctx.fillStyle = '#475569';
                platforms.forEach(p => ctx.fillRect(p.x, p.y, p.w, p.h));

                if (players[myId])
